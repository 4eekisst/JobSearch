databaseChangeLog:
  - changeSet:
      id: drop column - Account type
      author: Adil
      changes:
        - dropColumn:
            columnName: acc_type
            columns:
              - column:
                  name: acc_type
            schemaName: public
            tableName: users
  - changeSet:
      id: modify users
      author: Adil
      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: enabled
                  type: boolean
                  constraints:
                    nullable: false