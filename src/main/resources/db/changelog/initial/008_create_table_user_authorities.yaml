databaseChangeLog:
  - changeSet:
      id: create user-authorities
      author: Adil
      changes:
        - createTable:
            tableName: user_authority
            columns:
              - column:
                  name: email
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: authority_id
                  type: long
                  constraints:
                    foreignKeyName: fk_authority_id
                    nullable: false
                    references: authorities(id)
