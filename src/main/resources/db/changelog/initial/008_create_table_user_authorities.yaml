databaseChangeLog:
  - changeSet:
      id: create user_authorities
      author: Adil
      changes:
        - createTable:
            tableName: user_authority
            columns:
              - column:
                  name: user_id
                  type: long
                  constraints:
                    foreignKeyName: fk_user_id
                    nullable: false
                    references: users(id)
              - column:
                  name: authority_id
                  type: long
                  constraints:
                    foreignKeyName: fk_authority_id
                    nullable: false
                    references: authorities(id)